plugins {
    id 'java'
    id 'war'
}

group = 'com.secondzip'
version = '1.0-SNAPSHOT'

sourceCompatibility = '17'
targetCompatibility = '17'

repositories {
    mavenCentral()
}

ext {
    springVersion = '5.3.37'
    springSecurityVersion = '5.8.13'
    log4jVersion = '2.20.0'
    slf4jVersion = '2.0.9'
    lombokVersion = '1.18.30'
    mybatisVersion = '3.5.13'
    mybatisSpringVersion = '2.1.2'
    junitVersion = '5.10.2'
    flywayVersion = '12.10.0'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

processResources {
    // .env는 로컬에서만 사용하고 클래스패스/WAR에는 복사하지 않는다.
    exclude '.env'
}

dependencies {
    // ===== Spring =====
    implementation("org.springframework:spring-context:${springVersion}") {
        exclude group: 'commons-logging', module: 'commons-logging'
    }
    implementation "org.springframework:spring-webmvc:${springVersion}"
    implementation "org.springframework:spring-tx:${springVersion}"
    implementation "org.springframework:spring-jdbc:${springVersion}"
    implementation 'javax.inject:javax.inject:1'

    // ===== Spring Security =====
    implementation "org.springframework.security:spring-security-web:${springSecurityVersion}"
    implementation "org.springframework.security:spring-security-config:${springSecurityVersion}"
    implementation "org.springframework.security:spring-security-core:${springSecurityVersion}"
    implementation "org.springframework.security:spring-security-taglibs:${springSecurityVersion}"

    // ===== JWT =====
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // ===== Redis =====
    implementation 'redis.clients:jedis:4.4.3'
    implementation 'org.springframework.data:spring-data-redis:2.7.18'
    implementation 'io.lettuce:lettuce-core:6.2.6.RELEASE'

    // ==== DTO 검증 ====

    // ===== AWS S3 =====
    implementation 'com.amazonaws:aws-java-sdk-s3:1.12.600'

    // ===== Swagger =====
    implementation 'io.springfox:springfox-swagger2:2.9.2'
    implementation 'io.springfox:springfox-swagger-ui:2.9.2'

    // ===== AOP =====
    implementation 'org.aspectj:aspectjrt:1.9.20'
    implementation 'org.aspectj:aspectjweaver:1.9.20'

    // ===== Servlet / JSP / JSTL (Tomcat 9 = javax 네임스페이스, Java 버전과 무관) =====
    compileOnly 'javax.servlet:javax.servlet-api:4.0.1'
    compileOnly 'javax.servlet.jsp:javax.servlet.jsp-api:2.3.3'
    implementation 'javax.servlet:jstl:1.2'

    // ===== Log4j2 Logging =====
    implementation "org.apache.logging.log4j:log4j-api:${log4jVersion}"
    implementation "org.apache.logging.log4j:log4j-core:${log4jVersion}"
    implementation "org.apache.logging.log4j:log4j-slf4j2-impl:${log4jVersion}"

    // ===== SLF4J =====
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    runtimeOnly "org.slf4j:jcl-over-slf4j:${slf4jVersion}"

    // ===== SQL 로깅 =====
    // implementation 'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4:1.16'
    implementation 'com.lwohvye.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4.1:1.18'

    // ===== XML 내 한글 처리 =====
    implementation 'xerces:xercesImpl:2.12.2'

    // ===== Lombok =====
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // ===== Jackson =====
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.2'

    // ===== 데이터베이스 =====
    implementation 'com.mysql:mysql-connector-j:8.1.0'
    implementation 'com.zaxxer:HikariCP:4.0.3'

    implementation "org.mybatis:mybatis:${mybatisVersion}"
    implementation "org.mybatis:mybatis-spring:${mybatisSpringVersion}"

    // ===== 테스트 =====
    testImplementation "org.springframework:spring-test:${springVersion}"
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"

    //swagger
    implementation 'io.springfox:springfox-swagger2:2.9.2'
    implementation 'io.springfox:springfox-swagger-ui:2.9.2'

    //validation(dto 검증)
    implementation 'javax.validation:validation-api:2.0.1.Final'
    implementation 'org.hibernate.validator:hibernate-validator:6.2.5.Final'
    implementation 'org.glassfish:javax.el:3.0.1-b12'

    // ===== Flyway =====
    implementation "org.flywaydb:flyway-core:${flywayVersion}"
    implementation "org.flywaydb:flyway-mysql:${flywayVersion}"

    // ===== websocket =====
    implementation 'org.springframework:spring-websocket:5.3.37'
}

war {
    archiveFileName = 'secondzip.war'
    // 로컬 개발용 비밀정보 파일이 배포 아티팩트에 포함되지 않도록 방지
    eachFile { details ->
        if (details.name == '.env') {
            details.exclude()
        }
    }
}

test {
    useJUnitPlatform()
}
