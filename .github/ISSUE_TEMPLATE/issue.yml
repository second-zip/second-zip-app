name: '작업 이슈'
description: '기능 구현, 수정, 리팩터링 등 프로젝트 작업을 등록합니다.'
body:
  - type: input
    id: feature-id
    attributes:
      label: '📌 관련 기능 ID'
      description: '기능 명세서의 기능 ID를 작성해주세요. 관련 기능 ID가 없는 작업은 N/A로 작성해주세요.'
      placeholder: '예: RE_01 또는 N/A'
    validations:
      required: true

  - type: textarea
    id: work-description
    attributes:
      label: '✨ 작업 내용'
      description: '구현하거나 수정할 내용을 작성해주세요.'
      placeholder: '로그인 API를 구현합니다. JWT를 통한 accessToken 및 refreshToken을 발급합니다.'
    validations:
      required: true

  - type: textarea
    id: completion-criteria
    attributes:
      label: '✅ 완료 조건'
      description: '작업 완료 여부를 확인할 수 있는 조건을 체크해주세요.'
      value: |
        - [ ] 기능 구현 완료
        - [ ] 테스트 완료
        - [ ] 관련 문서 수정
    validations:
      required: true
