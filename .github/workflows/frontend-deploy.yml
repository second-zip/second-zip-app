name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: secondzip-frontend-production
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true

          tags: |
            ghcr.io/second-zip/second-zip-frontend:latest
            ghcr.io/second-zip/second-zip-frontend:${{ github.sha }}

          build-args: |
            VITE_API_BASE_URL=/api
            VITE_ANALYSIS_TEST_BIRTH_DATE=${{ secrets.VITE_ANALYSIS_TEST_BIRTH_DATE }}
            VITE_ANALYSIS_TEST_PHONE_NO=${{ secrets.VITE_ANALYSIS_TEST_PHONE_NO }}
            VITE_ANALYSIS_TEST_USER_NAME=${{ secrets.VITE_ANALYSIS_TEST_USER_NAME }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
